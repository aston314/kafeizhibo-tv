import groovy.json.JsonSlurper
plugins { id "com.android.application" }
def product = new JsonSlurper().parse(file("../../app.json"))
def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: ""
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: ""
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: ""
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: ""
def releaseSigningConfigured = releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
if (releaseRequested && !releaseSigningConfigured) {
    throw new GradleException("Release builds require ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD")
}
android {
    namespace product.applicationId
    compileSdk 36
    defaultConfig {
        applicationId product.applicationId
        minSdk product.minSdk
        targetSdk 35
        versionCode product.versionCode
        versionName product.versionName
        resValue "string", "app_name", product.displayName
        resValue "string", "app_version", product.versionName
        ndk { abiFilters.addAll(product.abis) }
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes { debug { applicationIdSuffix ".debug"; versionNameSuffix "-debug" }; release { minifyEnabled false; if (releaseSigningConfigured) signingConfig signingConfigs.release } }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation "androidx.core:core:1.8.0"
    def media3_version = product.media3Version ?: "1.11.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    testImplementation "junit:junit:4.13.2"
}
